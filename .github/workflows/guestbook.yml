name: Update Guestbook

on:
  issue_comment:
    types: [created, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-guestbook:
    if: (github.event_name == 'issue_comment' && github.event.issue.title == 'Guestbook' && github.event.issue.pull_request == null) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rewrite guestbook section from the "Guestbook"-titled issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let issueNumber = context.payload.issue?.number;

            // Manual runs (workflow_dispatch) have no event issue — find it by title instead.
            // This also makes the workflow immune to number churn from PRs/other issues.
            if (!issueNumber) {
              const { data: found } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} type:issue in:title "Guestbook"`,
                per_page: 1,
              });
              issueNumber = found.items[0]?.number;
            }

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = '<!--GUESTBOOK:START-->';
            const end = '<!--GUESTBOOK:END-->';
            const before = readme.split(start)[0];
            const after = readme.split(end)[1];
            const noteUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?title=Guestbook`;

            let block;
            if (!issueNumber) {
              block = '*no entries yet — be the first.*';
            } else {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 10,
              });
              const latest = comments.slice(-8).reverse();
              block = latest.length === 0
                ? '*no entries yet — be the first.*'
                : latest.map(c => `> ${c.body.trim().replace(/\n/g, ' ')} — **@${c.user.login}**`).join('\n\n');
            }

            const middle = `${start}\n<div align="center">\n\n**Guestbook** — [leave a note &#8594;](${noteUrl})\n\n${block}\n\n</div>\n${end}`;
            fs.writeFileSync(readmePath, `${before}${middle}${after}`);

      - name: Commit guestbook update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: update guestbook [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
