name: Update Guestbook

on:
  issue_comment:
    types: [created, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-guestbook:
    if: github.event.issue.number == 1 || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rewrite guestbook section from issue #1 comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              per_page: 10,
            });

            const latest = comments.slice(-8).reverse();
            let block;
            if (latest.length === 0) {
              block = '*no entries yet — be the first.*';
            } else {
              block = latest
                .map(c => `> ${c.body.trim().replace(/\n/g, ' ')} — **@${c.user.login}**`)
                .join('\n\n');
            }

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = '<!--GUESTBOOK:START-->';
            const end = '<!--GUESTBOOK:END-->';
            const before = readme.split(start)[0];
            const after = readme.split(end)[1];
            const middle = `${start}\n<div align="center">\n\n**Guestbook** — [leave a note &#8594;](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/1)\n\n${block}\n\n</div>\n${end}`;
            fs.writeFileSync(readmePath, `${before}${middle}${after}`);

      - name: Commit guestbook update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update guestbook [skip ci]"
          git push
