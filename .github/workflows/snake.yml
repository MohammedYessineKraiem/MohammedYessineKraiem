name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create generated directory
        run: mkdir -p assets/generated

      - name: Generate snake animation (light + dark, blood-red palette)
        uses: Platane/snk@v3
        with:
          github_user_name: MohammedYessineKraiem
          outputs: |
            assets/generated/snake-light.svg?color_snake=%23540303&color_dots=%23ebedf0,%23f2c9c9,%23dc8a8a,%23c23b4a,%23540303
            assets/generated/snake-dark.svg?color_snake=%23e0334a&color_dots=%23151515,%23451c1c,%234d0a0a,%23c23b4a,%23e0334a

      - name: Commit generated snake assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/snake-light.svg assets/generated/snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: regenerate contribution snake [skip ci]"
          git push
