<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 02 — EXPERTISE">
  <style>
    :root { --rule: #4d0a0a; --muted: #540303; --accent: #4d0b16; --dim: #451c1c; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw,.f { animation: none; } .draw{stroke-dashoffset:0} .f{opacity:1} }
  </style>
  <g class="f">
    <text class="mono" x="48" y="68" font-size="56" fill="var(--dim)">02</text>
    <text class="mono" x="128" y="58" font-size="15" fill="var(--accent)" letter-spacing="6">EXPERTISE</text>
    <text class="mono" x="952" y="58" font-size="12" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/02-expertise</text>
  </g>
  <line class="draw" x1="380" y1="53" x2="820" y2="53"/>
</svg>
