<svg viewBox="0 0 1000 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Philosophy">
  <style>
    :root { --bone: #0A0000; --rule: #4d0a0a; --muted: #540303; --accent: #4d0b16; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ticker { animation: marquee 28s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .ticker { animation: none; } }
  </style>
  <line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="var(--rule)"/>
  <line x1="0" y1="63.5" x2="1000" y2="63.5" stroke="var(--rule)"/>
  <clipPath id="clip"><rect x="10" y="4" width="980" height="56"/></clipPath>
  <g clip-path="url(#clip)">
    <g class="ticker" fill="var(--bone)" font-size="13" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="1">
      <text y="38">
        <tspan x="26">SIMPLICITY IS PREREQUISITE FOR RELIABILITY &#8212; DIJKSTRA</tspan>
        <tspan dx="50" fill="var(--accent)">&#10038;</tspan>
        <tspan dx="50" fill="var(--muted)">WHAT HURTS MORE, THE PAIN OF HARD WORK OR THE PAIN OF REGRET?</tspan>
        <tspan dx="50" fill="var(--accent)">&#10038;</tspan>
        <tspan dx="50">ENGINEERING THE BACKBONE OF TOMORROW'S SYSTEMS</tspan>
        <tspan dx="50" fill="var(--accent)">&#10038;</tspan>
        <tspan dx="50" fill="var(--muted)">SECURE BY DEFAULT &#183; SHIP UNDER REAL CONSTRAINTS</tspan>
        <tspan dx="80">SIMPLICITY IS PREREQUISITE FOR RELIABILITY &#8212; DIJKSTRA</tspan>
        <tspan dx="50" fill="var(--accent)">&#10038;</tspan>
        <tspan dx="50" fill="var(--muted)">WHAT HURTS MORE, THE PAIN OF HARD WORK OR THE PAIN OF REGRET?</tspan>
      </text>
    </g>
  </g>
  <defs>
    <linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="white" stop-opacity="1"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <linearGradient id="fr" x1="1" x2="0"><stop offset="0" stop-color="white" stop-opacity="1"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="40" height="64" fill="white"/>
  <rect x="960" width="40" height="64" fill="white"/>
</svg>
