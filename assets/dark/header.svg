<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammed Yessine Kraiem">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #c23b4a; --dim: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    .rot { opacity:0; animation: rot 12s linear infinite; }
    .r1{animation-delay:1.0s} .r2{animation-delay:4.0s} .r3{animation-delay:7.0s} .r4{animation-delay:10.0s}
    @keyframes rot { 0%{opacity:0} 1.5%{opacity:1} 18%{opacity:1} 20%{opacity:0} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.rot { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} .rot{opacity:0} .rot.r1{opacity:1}
    }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="12" letter-spacing="3.5">PROFILE &#8212; INDEX N&#186; 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="12" letter-spacing="3.5" text-anchor="end">PARIS, FR &#8212; 48.86&#176; N</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="166" font-size="60" letter-spacing="-1">Mohammed Yessine</text>
    <text fill="var(--bone)" class="mono" x="46" y="228" font-size="60" letter-spacing="-1">Kraiem</text>
  </g>

  <g class="fade a3">
    <text fill="var(--muted)" class="mono rot r1" x="48" y="266" font-size="18.5">agentic AI &#183; RAG pipelines &#183; autonomous agents</text>
    <text fill="var(--muted)" class="mono rot r2" x="48" y="266" font-size="18.5">medical AI &#183; on-premise &#183; non-negotiable reliability</text>
    <text fill="var(--muted)" class="mono rot r3" x="48" y="266" font-size="18.5">full-stack &#183; Angular &#183; Spring Boot &#183; FastAPI</text>
    <text fill="var(--muted)" class="mono rot r4" x="48" y="266" font-size="18.5">network security &#183; designing secure by default</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="308" font-size="13.5" letter-spacing="1">focus  &#9656;</text>
    <text fill="var(--accent)" class="mono" x="128" y="308" font-size="13.5" letter-spacing="1">agentic AI &#183; medical AI &#183; full-stack &#183; network security</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="334" font-size="13.5" letter-spacing="1">open to internships &#183; collaboration &#183; open source</text>
  </g>

  <line class="draw a5" x1="48" y1="356" x2="952" y2="356" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="384" font-size="12.5" letter-spacing="3">AGENTIC AI</text>
    <text fill="var(--accent)" class="mono" x="210" y="384" font-size="12.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="232" y="384" font-size="12.5" letter-spacing="3">FULL-STACK</text>
    <text fill="var(--accent)" class="mono" x="385" y="384" font-size="12.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="407" y="384" font-size="12.5" letter-spacing="3">NETWORK SECURITY</text>
    <text fill="var(--muted)" class="mono" x="952" y="384" font-size="12.5" letter-spacing="3" text-anchor="end">ENSI &#8594; TSP &#8212; 2024 / 2028</text>
  </g>
</svg>
