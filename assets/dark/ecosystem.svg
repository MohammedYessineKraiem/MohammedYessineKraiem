<svg viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: agentic AI and LLM, medical AI, full-stack engineering, and network security, all radiating from one engineering pipeline">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #c23b4a; --dim: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: none; stroke: var(--rule); stroke-width: 1; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.15s}.w2{animation-delay:.25s}.w3{animation-delay:.35s}.w4{animation-delay:.45s}.w5{animation-delay:.55s}.w6{animation-delay:.65s}.w7{animation-delay:.75s}.w8{animation-delay:.85s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .25; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.7s}.p2{animation-delay:.8s}.p3{animation-delay:.9s}.p4{animation-delay:1.0s}.p5{animation-delay:1.1s}.p6{animation-delay:1.2s}.p7{animation-delay:1.3s}.p8{animation-delay:1.4s}
    .core { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop,.core { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.12}
    }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12" letter-spacing="3.5">SYSTEM MAP &#8212; ONE PIPELINE, FOUR DOMAINS</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="12" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <defs>
    <mask id="node-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="620">
      <rect x="0" y="0" width="1000" height="620" fill="white"/>
      <rect x="405" y="292" width="190" height="56" fill="black"/>
      <rect x="110" y="90"  width="190" height="54" fill="black"/>
      <rect x="405" y="70"  width="190" height="54" fill="black"/>
      <rect x="700" y="90"  width="190" height="54" fill="black"/>
      <rect x="770" y="200" width="190" height="54" fill="black"/>
      <rect x="770" y="340" width="190" height="54" fill="black"/>
      <rect x="300" y="482" width="190" height="54" fill="black"/>
      <rect x="560" y="482" width="190" height="54" fill="black"/>
      <rect x="40"  y="234" width="215" height="54" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#node-cutouts)">
    <line class="wire w1" x1="500" y1="292" x2="205" y2="130"/>
    <line class="wire w2" x1="500" y1="292" x2="500" y2="124"/>
    <line class="wire w3" x1="500" y1="292" x2="795" y2="130"/>
    <line class="wire w4" x1="500" y1="292" x2="865" y2="240"/>
    <line class="wire w5" x1="500" y1="292" x2="865" y2="360"/>
    <line class="wire w6" x1="500" y1="348" x2="395" y2="482"/>
    <line class="wire w7" x1="500" y1="348" x2="655" y2="482"/>
    <line class="wire w8" x1="500" y1="320" x2="255" y2="261"/>
  </g>
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="500" y1="292" x2="205" y2="130"/>
    <line class="flow" x1="500" y1="292" x2="500" y2="124"/>
    <line class="flow" x1="500" y1="292" x2="795" y2="130"/>
    <line class="flow" x1="500" y1="292" x2="865" y2="240"/>
    <line class="flow" x1="500" y1="292" x2="865" y2="360"/>
    <line class="flow" x1="500" y1="348" x2="395" y2="482"/>
    <line class="flow" x1="500" y1="348" x2="655" y2="482"/>
    <line class="flow" x1="500" y1="320" x2="255" y2="261"/>
  </g>

  <text fill="var(--accent)" class="mono pop p8" x="500" y="50" font-size="11" letter-spacing="3" text-anchor="middle">AGENTIC AI &amp; LLM</text>
  <text fill="var(--accent)" class="mono pop p8" x="865" y="185" font-size="11" letter-spacing="3" text-anchor="middle">MEDICAL AI</text>
  <text fill="var(--accent)" class="mono pop p8" x="500" y="565" font-size="11" letter-spacing="3" text-anchor="middle">FULL-STACK ENGINEERING</text>
  <text fill="var(--accent)" class="mono pop p8" x="147" y="220" font-size="11" letter-spacing="3" text-anchor="middle">NETWORK SECURITY</text>

  <g class="pop p0">
    <rect class="node core" x="405" y="292" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono" x="500" y="316" font-size="14" letter-spacing="2" text-anchor="middle">KRAIEM.SYS</text>
    <text fill="var(--muted)" class="mono" x="500" y="334" font-size="9.5" letter-spacing=".5" text-anchor="middle">cross-domain engineering pipeline</text>
  </g>

  <g class="pop p1"><rect class="node" x="110" y="90" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="205" y="113" font-size="13" letter-spacing="1" text-anchor="middle">axora</text><text fill="var(--muted)" class="mono" x="205" y="132" font-size="10" letter-spacing="1" text-anchor="middle">ACP knowledge graph &#183; AxeFinance</text></g>
  <g class="pop p2"><rect class="node" x="405" y="70" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="93" font-size="13" letter-spacing="1" text-anchor="middle">smartmail ai</text><text fill="var(--muted)" class="mono" x="500" y="112" font-size="10" letter-spacing="1" text-anchor="middle">Gmail API &#183; tone analysis</text></g>
  <g class="pop p3"><rect class="node" x="700" y="90" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="795" y="113" font-size="13" letter-spacing="1" text-anchor="middle">textbrevity</text><text fill="var(--muted)" class="mono" x="795" y="132" font-size="10" letter-spacing="1" text-anchor="middle">summarizer &#183; transformers</text></g>

  <g class="pop p4"><rect class="node" x="770" y="200" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="865" y="223" font-size="13" letter-spacing="1" text-anchor="middle">axismed</text><text fill="var(--muted)" class="mono" x="865" y="242" font-size="10" letter-spacing="1" text-anchor="middle">voice dictation &#183; La Rabta hospital</text></g>
  <g class="pop p5"><rect class="node" x="770" y="340" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="865" y="363" font-size="13" letter-spacing="1" text-anchor="middle">radreport nlp</text><text fill="var(--muted)" class="mono" x="865" y="382" font-size="10" letter-spacing="1" text-anchor="middle">CIMS &#183; whisper + spaCy</text></g>

  <g class="pop p6"><rect class="node" x="300" y="482" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="395" y="505" font-size="13" letter-spacing="1" text-anchor="middle">b.c. copilot</text><text fill="var(--muted)" class="mono" x="395" y="524" font-size="10" letter-spacing="1" text-anchor="middle">Dynamics 365 &#183; contextual RAG</text></g>
  <g class="pop p7"><rect class="node" x="560" y="482" width="190" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="655" y="505" font-size="13" letter-spacing="1" text-anchor="middle">match predictor</text><text fill="var(--muted)" class="mono" x="655" y="524" font-size="10" letter-spacing="1" text-anchor="middle">scikit-learn &#183; standings</text></g>

  <g class="pop p8"><rect class="node" x="40" y="234" width="215" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="147" y="257" font-size="13" letter-spacing="1" text-anchor="middle">axismed &#183; security layer</text><text fill="var(--muted)" class="mono" x="147" y="276" font-size="10" letter-spacing="1" text-anchor="middle">loopback-only &#183; SSH tunnel &#183; RBAC</text></g>

  <line x1="48" y1="588" x2="952" y2="588" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="608" font-size="11" letter-spacing="2" text-anchor="end">DASHED LINES &#8212; DATA IN MOTION</text>
</svg>
