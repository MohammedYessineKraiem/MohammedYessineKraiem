<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: academic and career trajectory, and profile counters — 7 repositories, 5 projects shipped, 4 internships, 4 languages spoken">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #c23b4a; --dim: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 116px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .spark,.dot,.rise,.ping { animation: none; }
      .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12" letter-spacing="3.5">TELEMETRY &#8212; TRAJECTORY &amp; COUNTERS</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="12" letter-spacing="3.5" text-anchor="end">FIG. 05</text>
  <line x1="688" y1="64" x2="688" y2="296" stroke="var(--rule)" opacity=".4"/>

  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="11" letter-spacing="2.5">TRAJECTORY &#183; 2024 &#8594; NOW</text>
  <g>
    <line x1="48" y1="252" x2="622" y2="252" stroke="var(--rule)"/>
    <polyline class="spark" points="48,240 160,220 300,190 440,150 540,120 622,92" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="160" cy="220" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="300" cy="190" r="2.5" fill="var(--bone)"/>
    <circle class="dot d3" cx="440" cy="150" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="622" cy="92" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d4" cx="622" cy="92" r="3" fill="var(--accent)"/>
    <text fill="var(--dim)" class="mono" x="48" y="272" font-size="10.5" letter-spacing="1">RANK 128</text>
    <text fill="var(--dim)" class="mono" x="300" y="272" font-size="10.5" letter-spacing="1" text-anchor="middle">MAJOR DE PROMOTION</text>
    <text fill="var(--dim)" class="mono" x="440" y="272" font-size="10.5" letter-spacing="1" text-anchor="middle">AI INTERN</text>
    <text fill="var(--muted)" class="mono" x="622" y="272" font-size="10.5" letter-spacing="1" text-anchor="end">&#201;IFFEL SCHOLAR</text>
    <text fill="var(--muted)" class="mono dot d4" x="48" y="300" font-size="11" letter-spacing="1.5">trend &#8212; <tspan fill="var(--accent)">ascending</tspan></text>
  </g>

  <g>
    <g class="rise n1"><text fill="var(--bone)" class="mono" x="720" y="118" font-size="44">7</text><text fill="var(--muted)" class="mono" x="782" y="112" font-size="11" letter-spacing="2.5">REPOSITORIES</text></g>
    <g class="rise n2"><text fill="var(--bone)" class="mono" x="720" y="178" font-size="44">5</text><text fill="var(--muted)" class="mono" x="782" y="172" font-size="11" letter-spacing="2.5">PROJECTS SHIPPED</text></g>
    <g class="rise n3"><text fill="var(--bone)" class="mono" x="720" y="238" font-size="44">4</text><text fill="var(--muted)" class="mono" x="782" y="232" font-size="11" letter-spacing="2.5">INTERNSHIPS COMPLETED</text></g>
    <g class="rise n4"><text fill="var(--accent)" class="mono" x="720" y="298" font-size="44">4</text><text fill="var(--muted)" class="mono" x="782" y="292" font-size="11" letter-spacing="2.5">LANGUAGES SPOKEN</text></g>
  </g>
</svg>
