<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: 2022 FSM Monastir, 2024 rank 128 and ENSI, 2025 AxeFinance internship and AxisMed at La Rabta hospital, now Eiffel Excellence Scholar, 2028 incoming Telecom SudParis">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #c23b4a; --dim: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.9s}.m3{animation-delay:1.4s}.m4{animation-delay:1.7s}.m5{animation-delay:2.0s}.m6{animation-delay:2.3s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 950px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="12" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="100" cy="125" r="4" fill="var(--bone)"/>
    <line x1="100" y1="121" x2="100" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="100" y="74" font-size="12" letter-spacing="2" text-anchor="middle">2022</text>
    <text fill="var(--bone)" class="mono" x="100" y="90" font-size="11.5" letter-spacing="1" text-anchor="middle">FSM Monastir &#183; Math-Physique</text>
  </g>

  <g class="m m2">
    <circle cx="330" cy="125" r="4" fill="var(--bone)"/>
    <line x1="330" y1="129" x2="330" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="330" y="172" font-size="12" letter-spacing="2" text-anchor="middle">2024</text>
    <text fill="var(--bone)" class="mono" x="330" y="188" font-size="11.5" letter-spacing="1" text-anchor="middle">Rank 128 nat'l &#183; ENSI, Major de Promotion</text>
  </g>

  <g class="m m3">
    <circle cx="560" cy="125" r="4" fill="var(--bone)"/>
    <line x1="560" y1="121" x2="560" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="560" y="74" font-size="12" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="560" y="90" font-size="11.5" letter-spacing="1" text-anchor="middle">AI Intern @ AxeFinance &#183; Axora</text>
  </g>

  <g class="m m4">
    <circle cx="750" cy="125" r="4" fill="var(--bone)"/>
    <line x1="750" y1="129" x2="750" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="750" y="172" font-size="12" letter-spacing="2" text-anchor="middle">DEC '25</text>
    <text fill="var(--bone)" class="mono" x="750" y="188" font-size="11.5" letter-spacing="1" text-anchor="middle">AxisMed &#183; La Rabta Hospital</text>
  </g>

  <g class="m m5">
    <circle class="ring" cx="950" cy="125" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="pulse" cx="950" cy="125" r="4.5" fill="var(--accent)"/>
    <line x1="950" y1="121" x2="950" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="950" y="74" font-size="12" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="var(--bone)" class="mono" x="950" y="90" font-size="11.5" letter-spacing="1" text-anchor="middle">&#201;iffel Excellence Scholar</text>
  </g>

  <g class="m m6">
    <circle cx="1152" cy="125" r="3" fill="var(--dim)"/>
    <text fill="var(--dim)" class="mono" x="1152" y="150" font-size="11" letter-spacing="2" text-anchor="end">2028 &#8594;</text>
    <text fill="var(--dim)" class="mono" x="1152" y="172" font-size="14" text-anchor="end">incoming, T&#233;l&#233;com SudParis</text>
  </g>
</svg>
