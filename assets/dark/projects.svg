<svg viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five featured projects: AxisMed, Axora, SmartMail AI, Premier League Match Predictor, TextBrevity">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #c23b4a; --dim: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .a1{animation-delay:.1s}.a2{animation-delay:.28s}.a3{animation-delay:.46s}.a4{animation-delay:.64s}.a5{animation-delay:.82s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12" letter-spacing="3.5">FEATURED PROJECTS</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="12" letter-spacing="3.5" text-anchor="end">FIG. 02</text>

  <g class="rise a1">
    <text fill="var(--dim)" class="mono" x="48" y="80" font-size="22">01</text>
    <text fill="var(--bone)" class="mono" x="90" y="80" font-size="17.5" letter-spacing="1">AxisMed &#8212; Clinical Radiology Reporting Platform</text>
    <text fill="var(--muted)" class="mono" x="90" y="102" font-size="13.5">Real-time voice-dictated structured reports, deployed at La Rabta Hospital.</text>
    <text fill="var(--accent)" class="mono" x="90" y="122" font-size="11.5" letter-spacing="1">Angular &#183; Spring Boot &#183; FastAPI &#183; pgvector &#183; Ollama &#183; CUDA</text>
  </g>
  <line class="rise a1" x1="48" y1="140" x2="952" y2="140" stroke="var(--rule)" opacity=".45"/>

  <g class="rise a2">
    <text fill="var(--dim)" class="mono" x="48" y="166" font-size="22">02</text>
    <text fill="var(--bone)" class="mono" x="90" y="166" font-size="17.5" letter-spacing="1">Axora &#8212; ACP Living Documentation Engine</text>
    <text fill="var(--muted)" class="mono" x="90" y="188" font-size="13.5">Keeps AxeFinance's ACP docs in sync via continuous knowledge-graph diffing.</text>
    <text fill="var(--accent)" class="mono" x="90" y="208" font-size="11.5" letter-spacing="1">Python &#183; FastAPI &#183; PostgreSQL &#183; NetworkX &#183; Angular 21</text>
  </g>
  <line class="rise a2" x1="48" y1="226" x2="952" y2="226" stroke="var(--rule)" opacity=".45"/>

  <g class="rise a3">
    <text fill="var(--dim)" class="mono" x="48" y="252" font-size="22">03</text>
    <text fill="var(--bone)" class="mono" x="90" y="252" font-size="17.5" letter-spacing="1">SmartMail AI &#8212; Intelligent Email Assistant</text>
    <text fill="var(--muted)" class="mono" x="90" y="274" font-size="13.5">Automated drafting, tone analysis, and sending via the Gmail API.</text>
    <text fill="var(--accent)" class="mono" x="90" y="294" font-size="11.5" letter-spacing="1">Python &#183; Gmail API &#183; Docker</text>
  </g>
  <line class="rise a3" x1="48" y1="312" x2="952" y2="312" stroke="var(--rule)" opacity=".45"/>

  <g class="rise a4">
    <text fill="var(--dim)" class="mono" x="48" y="338" font-size="22">04</text>
    <text fill="var(--bone)" class="mono" x="90" y="338" font-size="17.5" letter-spacing="1">Premier League Match Predictor</text>
    <text fill="var(--muted)" class="mono" x="90" y="360" font-size="13.5">Match-outcome prediction from historical data with interactive standings.</text>
    <text fill="var(--accent)" class="mono" x="90" y="380" font-size="11.5" letter-spacing="1">Python &#183; scikit-learn</text>
  </g>
  <line class="rise a4" x1="48" y1="398" x2="952" y2="398" stroke="var(--rule)" opacity=".45"/>

  <g class="rise a5">
    <text fill="var(--dim)" class="mono" x="48" y="424" font-size="22">05</text>
    <text fill="var(--bone)" class="mono" x="90" y="424" font-size="17.5" letter-spacing="1">TextBrevity &#8212; Automatic Text Summarizer</text>
  </g>
</svg>
