<svg viewBox="0 0 1000 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quote of the day: Secure by default.">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 904; stroke-dashoffset: 904; animation: draw 1.3s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .8s ease .3s forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }
  </style>
  <line class="draw" x1="48" y1="24" x2="952" y2="24" stroke="var(--rule)"/>
  <text class="mono fade" x="500" y="60" font-size="15" fill="var(--bone)" text-anchor="middle">&#8220;Secure by default.&#8221;</text>
  <text class="mono fade" x="500" y="84" font-size="10.5" fill="var(--accent)" text-anchor="middle" letter-spacing="2">QUOTE OF THE DAY</text>
</svg>
