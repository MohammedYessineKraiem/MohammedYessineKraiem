<svg viewBox="0 0 1000 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live weather in Paris: Overcast , 16°C">
  <style>
    :root { --bone: #EDE4DE; --rule: #6b1a1a; --muted: #7a3a3a; --accent: #e0334a; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .fade { opacity: 0; animation: fade .8s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @media (prefers-reduced-motion: reduce) { .fade,.pulse { animation: none; opacity: 1; } }
  </style>
  <line x1="48" y1="24" x2="952" y2="24" stroke="var(--rule)"/>
  <text class="mono fade" x="48" y="16" font-size="10.5" fill="var(--muted)" letter-spacing="3">LIVE WEATHER &#8212; PARIS, FR</text>
  <circle class="pulse" cx="60" cy="66" r="4" fill="var(--accent)"/>
  <text class="mono fade" x="82" y="72" font-size="30" fill="var(--bone)">16&#176;C</text>
  <text class="mono fade" x="270" y="72" font-size="14" fill="var(--muted)">Overcast </text>
  <text class="mono fade" x="952" y="72" font-size="11" fill="var(--muted)" text-anchor="end" letter-spacing="1">FEELS 15&#176;C &#183; HUMIDITY 72%</text>
</svg>
