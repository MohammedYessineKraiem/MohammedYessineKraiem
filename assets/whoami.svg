<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami &#8212; bio, focus, status">
  <style>
    :root { --bone: #0A0000; --rule: #4d0a0a; --muted: #540303; --dim: #451c1c; --accent: #4d0b16; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="15" fill="var(--bone)">2nd-year CS at ENSI (Major de Promotion) &#8594; incoming T&#233;l&#233;com SudParis 2028.</text>
  <text class="mono rise a2" x="48" y="60" font-size="15" fill="var(--bone)">building agentic AI, RAG pipelines, and autonomous agents that ship to production.</text>
  <text class="mono rise a3" x="48" y="88" font-size="14" fill="var(--muted)">security as a foundation, not an afterthought. reliability is non-negotiable.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="14" fill="var(--bone)">Agentic AI &#183; Medical AI &#183; Full-Stack Engineering &#183; Network Security</text>

  <text class="mono rise a5" x="48"  y="178" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="178" font-size="14" fill="var(--accent)">open to internships &#183; collaboration &#183; open source</text>

  <text class="mono rise a6" x="48"  y="208" font-size="11" fill="var(--muted)" letter-spacing="2.5">CLUBS</text>
  <text class="mono rise a6" x="154" y="208" font-size="14" fill="var(--bone)">ENSI Junior Enterprise &#183; Competitive Programming Club &#183; JCI Teboulba</text>
</svg>
